    <script>
        const second = 1000,
            minute = second * 60,
            hour = minute * 60;

        function getNextMidnight() {
            let now = new Date();
            let nextMidnight = new Date();
            nextMidnight.setHours(24, 0, 0, 0); // Define para a próxima meia-noite

            // Se já passou da meia-noite, ajusta para o dia seguinte
            if (now.getTime() >= nextMidnight.getTime()) {
                nextMidnight.setDate(nextMidnight.getDate() + 1);
            }

            return nextMidnight;
        }

        let countDown = getNextMidnight();

        setInterval(function() {
            let now = new Date().getTime(),
                distance = countDown - now;

            document.getElementById('new-day').innerText = 0; // Sempre 0 dias, pois é hoje ou amanhã
            document.getElementById('new-hour').innerText = Math.floor((distance % (hour * 24)) / hour);
            document.getElementById('new-minute').innerText = Math.floor((distance % hour) / minute);
            document.getElementById('new-second').innerText = Math.floor((distance % minute) / second);
        }, second);

        // Configuração do efeito de confetes
        const confettiSettings = { target: 'confetti' };
        const confetti = new window.ConfettiGenerator(confettiSettings);
        confetti.render();

        // Configuração do efeito de paralaxe
        document.addEventListener('DOMContentLoaded', function() {
            const slides = document.querySelectorAll('.simpleslide100-item');
            let currentSlide = 0;

            function showNextSlide() {
                slides[currentSlide].style.display = 'none';
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].style.display = 'block';
            }

            slides[currentSlide].style.display = 'block';
            setInterval(showNextSlide, 5000); // Troca de imagem a cada 5 segundos
        });
    </script>
